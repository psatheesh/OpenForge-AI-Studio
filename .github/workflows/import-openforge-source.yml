name: Import OpenForge v0.6 source
on:
  workflow_dispatch:
  push:
    paths:
      - '.openforge-stage/manifest.json'
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract the source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .openforge-stage/manifest.json
          cat .openforge-stage/chunk-* > "$RUNNER_TEMP/openforge.b64"
          base64 --decode "$RUNNER_TEMP/openforge.b64" > "$RUNNER_TEMP/openforge.tar.gz"
          echo 'd6614e61b2db4e6c548d068c1250d614c5a2b566adba2cc8c133c1f2064ffd39  '"$RUNNER_TEMP/openforge.tar.gz" | sha256sum --check
          if tar -tzf "$RUNNER_TEMP/openforge.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive entry"; exit 1
          fi
          tar -xzf "$RUNNER_TEMP/openforge.tar.gz" -C .
          git rm -r .openforge-stage
          git rm .github/workflows/import-openforge-source.yml
          git add -A
          git -c user.name='OpenForge Source Publisher' -c user.email='actions@users.noreply.github.com' commit -m 'Import complete OpenForge AI Studio v0.6.0 source' || true
          git push origin HEAD:main
